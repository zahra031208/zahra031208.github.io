<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sertifikat Kaggle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #3b2f6b, #0f0b2d);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 900px;
      background: linear-gradient(135deg, #241a52, #1a1440);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .header span {
      font-size: 32px;
    }

    .subtitle {
      color: #b8b4ff;
      margin-top: 6px;
      font-size: 14px;
    }

    /* CARD LIST */
    .card-wrapper {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 30px;
    }

    .card {
      background: linear-gradient(135deg, #2f2a6f, #221d55);
      border-radius: 22px;
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #c7c4ff;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      background: linear-gradient(135deg, #6d6aff, #8b5cf6);
      margin-bottom: 14px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
    }

    /* BACK BUTTON */
    .back {
      margin-top: 40px;
    }

    .back a {
      color: #b8b4ff;
      text-decoration: none;
      font-size: 14px;
    }

    .back a:hover {
      text-decoration: underline;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 999;
    }

    .modal-content {
      margin: 4% auto;
      background: #1a1440;
      padding: 20px;
      width: 85%;
      max-width: 900px;
      border-radius: 20px;
      position: relative;
    }

    .modal-content img {
      width: 100%;
      border-radius: 12px;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 28px;
      cursor: pointer;
      color: #fff;
    }
    /* TOMBOL KEMBALI DI MODAL */
.modal-footer {
  margin-top: 18px;
  text-align: center;
}

.btn-back {
  padding: 10px 22px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  background: linear-gradient(135deg, #6d6aff, #8b5cf6);
  color: #fff;
  transition: opacity 0.3s ease;
}

.btn-back:hover {
  opacity: 0.85;
}

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span>🏆</span>
      <div>
        <h1>Sertifikat Kaggle</h1>
        <div class="subtitle">
          Sertifikat pembelajaran Kaggle yang telah berhasil diselesaikan
        </div>
      </div>
    </div>

    <div class="card-wrapper">
      <!-- PYTHON -->
      <div class="card">
        <div class="badge">Python</div>
        <h3>Python - Kaggle</h3>
        <p>Sertifikat penyelesaian kursus Python dasar Kaggle.</p>
        <a class="btn" onclick="openModal('modalPython')">Lihat Sertifikat →</a>
      </div>

      <!-- SQL -->
      <div class="card">
        <div class="badge">SQL</div>
        <h3>SQL - Kaggle</h3>
        <p>Sertifikat penyelesaian kursus SQL dasar Kaggle.</p>
        <a class="btn" onclick="openModal('modalSQL')">Lihat Sertifikat →</a>
      </div>
    </div>

    <div class="back">
      <a href="../index.html">← Kembali ke Beranda</a>
    </div>
  </div>

  <!-- MODAL PYTHON -->
<div id="modalPython" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('modalPython')">&times;</span>

    <img src="img/python.png" alt="Sertifikat Python">

    <div class="modal-footer">
      <button class="btn-back" onclick="closeModal('modalPython')">
        ← Kembali
      </button>
    </div>
  </div>
</div>


 <!-- MODAL SQL -->
<div id="modalSQL" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('modalSQL')">&times;</span>

    <img src="img/sql.png" alt="Sertifikat SQL">

    <div class="modal-footer">
      <button class="btn-back" onclick="closeModal('modalSQL')">
        ← Kembali
      </button>
    </div>
  </div>
</div>


  <script>
    function openModal(id) {
      document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }
  </script>

</body>
</html>
